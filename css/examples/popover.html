<!-- Opens with the native popovertarget attribute; asta.js positions it next to the trigger and places the arrow. -->
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
  <button class="asta-btn asta-btn-outline" popovertarget="ex-pop-one" aria-haspopup="dialog"><span class="asta-btn-label">Set reminder</span></button>
  <div id="ex-pop-one" popover="auto" role="dialog" tabindex="-1" data-asta-popover data-side="bottom" data-align="center" aria-label="Reminder" class="asta-float asta-popover" style="width:16rem">
    <svg class="asta-popover-arrow" data-asta-arrow width="14" height="7" viewBox="0 0 14 7" aria-hidden="true"><path d="M0 7 7 .8 14 7z"/><path d="M0 7 7 .8 14 7" stroke-width="1"/></svg>
    <p style="font-size:13px;font-weight:500">Remind me</p>
    <label class="asta-input asta-input-sm" style="margin-top:8px"><input class="asta-input-control" type="time" value="09:00"></label>
    <button class="asta-btn asta-btn-accent asta-btn-sm" style="margin-top:12px;width:100%" popovertarget="ex-pop-one" popovertargetaction="hide"><span class="asta-btn-label">Save</span></button>
  </div>
  <button class="asta-btn asta-btn-outline" popovertarget="ex-pop-two" aria-haspopup="dialog"><span class="asta-btn-label">Right side</span></button>
  <div id="ex-pop-two" popover="auto" role="dialog" tabindex="-1" data-asta-popover data-side="right" data-align="center" aria-label="Info" class="asta-float asta-popover">
    <svg class="asta-popover-arrow" data-asta-arrow width="14" height="7" viewBox="0 0 14 7" aria-hidden="true"><path d="M0 7 7 .8 14 7z"/><path d="M0 7 7 .8 14 7" stroke-width="1"/></svg>
    <p style="max-width:200px;font-size:13px;color:var(--ink-2)">Popovers flip when there is no room.</p>
  </div>
</div>
