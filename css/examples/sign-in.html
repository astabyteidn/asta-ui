<!-- Needs asta.js for the password reveal; the form posts to /sign-in, which returns the error or the signed-in state. -->
<div style="max-width:420px">
<div id="sign-in" data-asta-sign-in class="asta-sign-in"><form action="/sign-in" method="post" novalidate hx-post="/sign-in" hx-target="#sign-in" hx-swap="outerHTML" hx-indicator="find button[type=submit]" class="asta-sign-in-form">
<h3 class="asta-sign-in-title">Welcome back</h3><p class="asta-sign-in-subtitle">Use any email and the password astabyte.</p>
<div class="asta-sign-in-providers"><a class="asta-btn asta-btn-outline" href="#sign-in"><span class="asta-btn-label"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 6.6v2.9h4.1A4.3 4.3 0 0 1 8 12.4a4.4 4.4 0 0 1 0-8.8c1.1 0 2.1.4 2.9 1.1l2-2A7.3 7.3 0 0 0 8 .7a7.3 7.3 0 1 0 0 14.6c4.2 0 7-3 7-7.1 0-.5 0-1-.1-1.5H8Z"/></svg>Google</span><span class="asta-btn-spinner" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/><path d="M14 8a6 6 0 0 0-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></a><a class="asta-btn asta-btn-outline" href="#sign-in"><span class="asta-btn-label">GitHub</span><span class="asta-btn-spinner" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/><path d="M14 8a6 6 0 0 0-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></a></div>
<div class="asta-sign-in-divider" aria-hidden="true">or</div>
<div class="asta-sign-in-fields">
<div class="asta-field"><div class="asta-field-head"><label class="asta-label" for="si-email">Email</label></div><label class="asta-input"><input class="asta-input-control" id="si-email" name="si-email" type="email" placeholder="you@company.com" autocomplete="email"></label></div>
<div class="asta-field"><div class="asta-field-head"><label class="asta-label" for="si-pw">Password</label></div><div class="asta-sign-in-shake"><label class="asta-input" style="padding-right:4px"><input class="asta-input-control" id="si-pw" name="password" type="password" placeholder="At least 8 characters" aria-invalid="true" autocomplete="current-password"><svg class="asta-input-status" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 5v3.5M8 11h.01"/></svg><span class="asta-input-trailing"><button type="button" data-asta-reveal aria-label="Show password" aria-pressed="false" class="asta-sign-in-reveal"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2"/><path d="M2.5 13.5l11-11" class="asta-sign-in-reveal-slash"/></svg></button></span></label></div><p class="asta-error" role="alert">Wrong password. Try astabyte.</p></div>
</div>
<div class="asta-sign-in-options"><label class="asta-checkbox"><span class="asta-checkbox-box"><input type="checkbox" class="asta-checkbox-input" name="remember"><svg class="asta-checkbox-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg><span class="asta-checkbox-dash" aria-hidden="true"></span></span><span><span class="asta-checkbox-label" style="font-size:13px">Remember me</span></span></label><a href="#" class="asta-sign-in-link">Forgot password?</a></div>
<button class="asta-btn asta-sign-in-submit" type="submit"><span class="asta-btn-label">Sign in</span><span class="asta-btn-spinner" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/><path d="M14 8a6 6 0 0 0-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button>
<p class="asta-sign-in-footer">New here? <a href="#">Create an account</a></p>
</form></div>
</div>
