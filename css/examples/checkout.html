<!-- Needs asta.js (card formatting, quantity, totals) and a server: /checkout recalculates the summary and takes the order. -->
<div style="max-width:960px">
<form id="checkout" data-asta-checkout action="/checkout" method="post" novalidate hx-post="/checkout" hx-target="#checkout" hx-swap="outerHTML" hx-indicator="find button[type=submit]" class="asta-checkout-form">
<div class="asta-checkout-main"><div class="asta-checkout-steps">
<fieldset class="asta-checkout-section"><legend class="asta-checkout-legend"><span class="asta-checkout-num">1</span>Contact</legend><div class="asta-checkout-fields"><div class="asta-field"><div class="asta-field-head"><label class="asta-label" for="co-email">Email</label></div><label class="asta-input"><input class="asta-input-control" id="co-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"></label></div></div></fieldset>
<fieldset class="asta-checkout-section"><legend class="asta-checkout-legend"><span class="asta-checkout-num">2</span>Shipping</legend><div class="asta-checkout-fields">
<div class="asta-field"><div class="asta-field-head"><label class="asta-label" for="co-name">Full name</label></div><label class="asta-input"><input class="asta-input-control" id="co-name" name="name" type="text" autocomplete="name"></label></div><div class="asta-field"><div class="asta-field-head"><label class="asta-label" for="co-address">Address</label></div><label class="asta-input"><input class="asta-input-control" id="co-address" name="address" type="text" autocomplete="address-line1"></label></div>
<div class="asta-checkout-pair"><div class="asta-field"><div class="asta-field-head"><label class="asta-label" for="co-city">City</label></div><label class="asta-input"><input class="asta-input-control" id="co-city" name="city" type="text" autocomplete="address-level2"></label></div><div class="asta-field"><div class="asta-field-head"><label class="asta-label" for="co-postal">Postal code</label></div><label class="asta-input"><input class="asta-input-control" id="co-postal" name="postal" type="text" autocomplete="postal-code" autocapitalize="characters"></label></div></div>
<div class="asta-field"><div class="asta-field-head"><label class="asta-label" for="co-country">Country</label></div><div class="asta-select "><select class="asta-select-control" id="co-country" name="country" autocomplete="country"><option value="indonesia" selected>Indonesia</option><option value="singapore">Singapore</option><option value="australia">Australia</option><option value="united kingdom">United Kingdom</option><option value="united states">United States</option></select><svg class="asta-select-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></div></div>
<div role="radiogroup" aria-label="Shipping speed" class="asta-checkout-shipping">
<label class="asta-checkout-option"><input type="radio" name="shipping" value="standard" checked data-asta-checkout-recalc class="asta-sr-only"><span><span class="asta-checkout-option-label">Standard</span><span class="asta-checkout-option-eta">3–5 business days</span></span><span class="asta-checkout-option-price">Free</span></label>
<label class="asta-checkout-option"><input type="radio" name="shipping" value="express" data-asta-checkout-recalc class="asta-sr-only"><span><span class="asta-checkout-option-label">Express</span><span class="asta-checkout-option-eta">1–2 business days</span></span><span class="asta-checkout-option-price">$14.00</span></label>
</div></div></fieldset>
<fieldset class="asta-checkout-section"><legend class="asta-checkout-legend"><span class="asta-checkout-num">3</span>Payment</legend><div class="asta-checkout-fields">
<div class="asta-field"><div class="asta-field-head"><label class="asta-label" for="co-card">Card number</label></div><label class="asta-input"><input class="asta-input-control" id="co-card" name="cardNumber" type="text" placeholder="1234 1234 1234 1234" inputmode="numeric" data-asta-checkout-format="card" autocomplete="cc-number"><span class="asta-input-trailing"><svg viewBox="0 0 20 14" class="asta-checkout-card-glyph" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x=".75" y=".75" width="18.5" height="12.5" rx="2.2"/><path d="M.75 4.5h18.5M4 9.5h4" stroke-linecap="round"/></svg></span></label></div>
<div class="asta-checkout-pair"><div class="asta-field"><div class="asta-field-head"><label class="asta-label" for="co-exp">Expiry</label></div><label class="asta-input"><input class="asta-input-control" id="co-exp" name="cardExpiry" type="text" placeholder="MM / YY" inputmode="numeric" data-asta-checkout-format="expiry" autocomplete="cc-exp"></label></div><div class="asta-field"><div class="asta-field-head"><label class="asta-label" for="co-cvc">CVC</label></div><label class="asta-input"><input class="asta-input-control" id="co-cvc" name="cardCvc" type="text" placeholder="123" inputmode="numeric" data-asta-checkout-format="cvc" autocomplete="cc-csc"></label></div></div>
</div></fieldset>
<div><button class="asta-btn asta-btn-accent asta-btn-lg asta-checkout-pay" type="submit"><span class="asta-btn-label"><span>Pay</span><span id="checkout-pay-total">$88.80</span></span><span class="asta-btn-spinner" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/><path d="M14 8a6 6 0 0 0-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button><p class="asta-checkout-note">Payments are encrypted. You won't be charged twice.</p></div>
</div></div>
<aside id="checkout-summary" aria-label="Order summary" data-asta-checkout-summary class="asta-checkout-summary">
<h3 class="asta-checkout-summary-title">Order</h3>
<ul class="asta-checkout-items"><li class="asta-checkout-item"><span aria-hidden="true" class="asta-checkout-thumb">A</span><div class="asta-checkout-item-body"><div class="asta-checkout-item-head"><p class="asta-checkout-item-name">Astabyte tee</p><span data-asta-money="line-tee" class="asta-checkout-amount"><span>$32.00</span></span></div><p class="asta-checkout-item-variant">Oat · M</p><div class="asta-checkout-qty" role="group" aria-label="Quantity of Astabyte tee" data-asta-checkout-qty><input type="hidden" name="qty_tee" value="1">
<button type="button" class="asta-checkout-qty-btn" aria-label="Fewer" data-asta-checkout-step="-1" disabled><svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 6h7"/></svg></button>
<span class="asta-checkout-qty-text" data-asta-checkout-qty-text>1</span>
<button type="button" class="asta-checkout-qty-btn" aria-label="More" data-asta-checkout-step="1"><svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 6h7M6 2.5v7"/></svg></button></div></div></li><li class="asta-checkout-item"><span aria-hidden="true" class="asta-checkout-thumb">F</span><div class="asta-checkout-item-body"><div class="asta-checkout-item-head"><p class="asta-checkout-item-name">Field cap</p><span data-asta-money="line-cap" class="asta-checkout-amount"><span>$48.00</span></span></div><p class="asta-checkout-item-variant">Black</p><div class="asta-checkout-qty" role="group" aria-label="Quantity of Field cap" data-asta-checkout-qty><input type="hidden" name="qty_cap" value="2">
<button type="button" class="asta-checkout-qty-btn" aria-label="Fewer" data-asta-checkout-step="-1"><svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 6h7"/></svg></button>
<span class="asta-checkout-qty-text" data-asta-checkout-qty-text>2</span>
<button type="button" class="asta-checkout-qty-btn" aria-label="More" data-asta-checkout-step="1"><svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 6h7M6 2.5v7"/></svg></button></div></div></li></ul>
<div class="asta-checkout-promo"><details><summary class="asta-checkout-promo-toggle">Add a promo code</summary><div class="asta-checkout-promo-row"><label class="asta-input asta-input-sm"><input class="asta-input-control" name="promo" placeholder="Enter code…" aria-label="Promo code" data-asta-checkout-promo autocomplete="off" autocapitalize="characters" spellcheck="false"></label><button type="button" class="asta-btn asta-btn-outline asta-btn-sm" data-asta-checkout-apply><span class="asta-btn-label">Apply</span><span class="asta-btn-spinner" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/><path d="M14 8a6 6 0 0 0-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button></div></details><p class="asta-checkout-promo-msg" aria-live="polite"></p></div>
<dl class="asta-checkout-totals">
<div><dt>Subtotal</dt><dd><span data-asta-money="subtotal" class="asta-checkout-amount"><span>$80.00</span></span></dd></div>
<div class="asta-checkout-discount"><dt>Discount</dt><dd><span data-asta-money="discount" class="asta-checkout-amount"><span>−$8.00</span></span></dd></div>
<div><dt>Shipping</dt><dd>Free</dd></div>
<div><dt>Tax</dt><dd><span data-asta-money="tax" class="asta-checkout-amount"><span>$8.80</span></span></dd></div>
<div class="asta-checkout-total"><dt>Total</dt><dd><span data-asta-money="total" class="asta-checkout-amount"><span>$88.80</span></span></dd></div>
</dl></aside>
</form>
</div>
