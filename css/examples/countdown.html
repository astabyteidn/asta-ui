<!-- asta.js ticks every countdown once a second and pauses it off screen. Set data-asta-countdown to an ISO date. -->
<div style="display:flex;flex-direction:column;align-items:flex-start;gap:24px">
<p style="font-size:13px;color:var(--mute)">Launch sale ends in</p>
<div class="asta-countdown asta-countdown-lg" role="timer" data-asta-countdown="2026-12-31T23:59:59Z" aria-label="Launch sale ends in"><span class="asta-countdown-unit"><span class="asta-countdown-value" data-unit="d">00</span><span class="asta-countdown-label">Days</span></span><span class="asta-countdown-sep" aria-hidden="true">:</span><span class="asta-countdown-unit"><span class="asta-countdown-value" data-unit="h">00</span><span class="asta-countdown-label">Hours</span></span><span class="asta-countdown-sep" aria-hidden="true">:</span><span class="asta-countdown-unit"><span class="asta-countdown-value" data-unit="m">00</span><span class="asta-countdown-label">Min</span></span><span class="asta-countdown-sep" aria-hidden="true">:</span><span class="asta-countdown-unit"><span class="asta-countdown-value" data-unit="s">00</span><span class="asta-countdown-label">Sec</span></span></div>
<div class="asta-countdown" role="timer" data-asta-countdown="2027-01-15T12:00:00Z" aria-label="Auction closes in"><span class="asta-countdown-unit"><span class="asta-countdown-value" data-unit="d">00</span><span class="asta-countdown-label">Days</span></span><span class="asta-countdown-sep" aria-hidden="true">:</span><span class="asta-countdown-unit"><span class="asta-countdown-value" data-unit="h">00</span><span class="asta-countdown-label">Hours</span></span><span class="asta-countdown-sep" aria-hidden="true">:</span><span class="asta-countdown-unit"><span class="asta-countdown-value" data-unit="m">00</span><span class="asta-countdown-label">Min</span></span></div>
<div class="asta-countdown asta-countdown-inline" role="timer" data-asta-countdown="2027-03-01T00:00:00Z" aria-label="Seats held for"><span class="asta-countdown-unit"><span class="asta-countdown-value" data-unit="d">00</span><span class="asta-countdown-label">d</span></span><span class="asta-countdown-sep" aria-hidden="true"> </span><span class="asta-countdown-unit"><span class="asta-countdown-value" data-unit="h">00</span><span class="asta-countdown-label">h</span></span><span class="asta-countdown-sep" aria-hidden="true"> </span><span class="asta-countdown-unit"><span class="asta-countdown-value" data-unit="m">00</span><span class="asta-countdown-label">m</span></span><span class="asta-countdown-sep" aria-hidden="true"> </span><span class="asta-countdown-unit"><span class="asta-countdown-value" data-unit="s">00</span><span class="asta-countdown-label">s</span></span></div>
</div>
