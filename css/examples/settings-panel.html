<!-- Needs asta.js for the unsaved-changes bar; the form posts to /settings. -->
<div style="max-width:520px">
<form id="settings" data-asta-settings hx-indicator="find [data-asta-settings-save]" action="/settings" method="post" hx-post="/settings" hx-swap="none" class="asta-settings-panel">
<div class="asta-settings-body">
<section class="asta-settings-section"><h4 class="asta-settings-heading">Appearance</h4><div class="asta-settings-rows"><div role="radiogroup" aria-label="Theme" class="asta-settings-theme"><label class="asta-settings-theme-option"><input type="radio" name="theme" value="light" class="asta-sr-only" checked><span class="asta-settings-swatch "></span><span class="asta-settings-theme-label">Light<span class="asta-settings-theme-radio"></span></span></label><label class="asta-settings-theme-option"><input type="radio" name="theme" value="dark" class="asta-sr-only"><span class="asta-settings-swatch asta-settings-swatch-dark"></span><span class="asta-settings-theme-label">Dark<span class="asta-settings-theme-radio"></span></span></label><label class="asta-settings-theme-option"><input type="radio" name="theme" value="system" class="asta-sr-only"><span class="asta-settings-swatch asta-settings-swatch-system"></span><span class="asta-settings-theme-label">System<span class="asta-settings-theme-radio"></span></span></label></div></div></section>
<section class="asta-settings-section"><h4 class="asta-settings-heading">Notifications</h4><p class="asta-settings-desc">Where Astabyte tells you about deploys.</p><div class="asta-settings-rows"><div class="asta-settings-row"><div><label for="n-email" class="asta-settings-row-label">Email</label><p class="asta-settings-row-desc">A summary when a deploy finishes.</p></div><div><span class="asta-switch-track"><input type="checkbox" role="switch" class="asta-switch-input" id="n-email" name="n-email" checked><span class="asta-switch-thumb" aria-hidden="true"></span></span></div></div><div class="asta-settings-row"><div><label for="n-push" class="asta-settings-row-label">Push</label><p class="asta-settings-row-desc">Only when something fails.</p></div><div><span class="asta-switch-track"><input type="checkbox" role="switch" class="asta-switch-input" id="n-push" name="n-push"><span class="asta-switch-thumb" aria-hidden="true"></span></span></div></div></div></section>
<section class="asta-settings-section"><h4 class="asta-settings-heading">Region</h4><div class="asta-settings-rows"><div class="asta-settings-row"><div><label for="lang" class="asta-settings-row-label">Language</label><p class="asta-settings-row-desc">Used across the app.</p></div><div><div style="width:150px"><div class="asta-select asta-select-sm"><select class="asta-select-control" id="lang" name="lang"><option value="english" selected>English</option><option value="bahasa indonesia">Bahasa Indonesia</option></select><svg class="asta-select-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></div></div></div></div></div></section>
</div>
<div data-asta-settings-bar class="asta-settings-savebar"><div role="region" aria-label="Unsaved changes" class="asta-settings-toast">
<span class="asta-settings-status" aria-live="polite"><span data-asta-settings-saved class="asta-settings-saved-msg"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>Saved</span><span data-asta-settings-unsaved class="asta-settings-unsaved-msg"><span class="asta-settings-dot"></span><span>Unsaved changes</span></span></span>
<span data-asta-settings-unsaved class="asta-settings-actions"><button class="asta-btn asta-btn-ghost asta-btn-sm asta-settings-reset" type="reset" tabindex="-1"><span class="asta-btn-label">Reset</span><span class="asta-btn-spinner" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/><path d="M14 8a6 6 0 0 0-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button><button class="asta-btn asta-btn-accent asta-btn-sm" type="submit" data-asta-settings-save tabindex="-1"><span class="asta-btn-label">Save</span><span class="asta-btn-spinner" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/><path d="M14 8a6 6 0 0 0-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button></span>
</div></div>
</form>
</div>
