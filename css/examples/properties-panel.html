<!-- Needs asta.js for drag-to-scrub values and the colour picker; changes post to /props. -->
<div style="max-width:280px">
<form data-asta-props class="asta-properties" action="/props" method="post" hx-post="/props" hx-trigger="change" hx-swap="none">
<div class="asta-properties-header"><span class="asta-properties-kind">Frame</span><span class="asta-properties-title">Hero card</span></div>
<div class="asta-properties-body">
<details open class="asta-prop-section"><summary class="asta-prop-summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>Layout</summary><div data-asta-props-body class="asta-prop-content"><div class="asta-prop-row"><span class="asta-prop-label">Position</span><div class="asta-prop-cells"><label data-asta-prop-scrub class="asta-prop-number"><span data-asta-prop-handle class="asta-prop-handle" aria-hidden="true">X</span><input class="asta-prop-input" name="x" value="120" inputmode="decimal" autocomplete="off" aria-label="x" data-step="1" data-precision="0"></label><label data-asta-prop-scrub class="asta-prop-number"><span data-asta-prop-handle class="asta-prop-handle" aria-hidden="true">Y</span><input class="asta-prop-input" name="y" value="48" inputmode="decimal" autocomplete="off" aria-label="y" data-step="1" data-precision="0"></label></div></div><div class="asta-prop-row"><span class="asta-prop-label">Size</span><div class="asta-prop-cells"><label data-asta-prop-scrub class="asta-prop-number"><span data-asta-prop-handle class="asta-prop-handle" aria-hidden="true">W</span><input class="asta-prop-input" name="w" value="320" inputmode="decimal" autocomplete="off" aria-label="w" data-step="1" data-precision="0"></label><label data-asta-prop-scrub class="asta-prop-number"><span data-asta-prop-handle class="asta-prop-handle" aria-hidden="true">H</span><input class="asta-prop-input" name="h" value="200" inputmode="decimal" autocomplete="off" aria-label="h" data-step="1" data-precision="0"></label></div></div><div class="asta-prop-row"><span class="asta-prop-label">Corners</span><div class="asta-prop-cells"><label data-asta-prop-scrub class="asta-prop-number"><span data-asta-prop-handle class="asta-prop-handle" aria-hidden="true">↻</span><input class="asta-prop-input" name="rot" value="0" inputmode="decimal" autocomplete="off" aria-label="rot" data-step="1" data-precision="0"><span class="asta-prop-unit">°</span></label><label data-asta-prop-scrub class="asta-prop-number"><span data-asta-prop-handle class="asta-prop-handle" aria-hidden="true">R</span><input class="asta-prop-input" name="r" value="12" inputmode="decimal" autocomplete="off" aria-label="r" data-step="1" data-precision="0"><span class="asta-prop-unit">px</span></label></div></div></div></details>
<details open class="asta-prop-section"><summary class="asta-prop-summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>Fill</summary><div data-asta-props-body class="asta-prop-content"><div class="asta-prop-row"><span class="asta-prop-label">Colour</span><div class="asta-prop-cells asta-prop-cells-1"><div data-asta-prop-color class="asta-prop-color"><label data-asta-prop-swatch class="asta-prop-swatch" style="background:#2f54eb"><input type="color" aria-label="Colour picker" value="#2f54eb"></label><input class="asta-prop-hex" name="fill" value="#2f54eb" aria-label="Colour hex" spellcheck="false" autocomplete="off" data-asta-prop-hex></div></div></div><div class="asta-prop-row"><span class="asta-prop-label">Opacity</span><div class="asta-prop-cells asta-prop-cells-1"><label data-asta-prop-scrub class="asta-prop-number"><span data-asta-prop-handle class="asta-prop-handle" aria-hidden="true">%</span><input class="asta-prop-input" name="opacity" value="100" inputmode="decimal" autocomplete="off" aria-label="opacity" data-step="1" data-precision="0"></label></div></div></div></details>
<details open class="asta-prop-section"><summary class="asta-prop-summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>Effects</summary><div data-asta-props-body class="asta-prop-content"><div class="asta-prop-row"><span class="asta-prop-label">Blur</span><div class="asta-prop-cells asta-prop-cells-1"><label data-asta-prop-scrub class="asta-prop-number"><span data-asta-prop-handle class="asta-prop-handle" aria-hidden="true">B</span><input class="asta-prop-input" name="blur" value="0" inputmode="decimal" autocomplete="off" aria-label="blur" data-step="1" data-precision="0"><span class="asta-prop-unit">px</span></label></div></div></div></details>
</div></form>
</div>
