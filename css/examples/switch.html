<div style="display:grid;gap:16px;max-width:360px">
  <label class="asta-switch">
    <span><span class="asta-switch-label">Deploy alerts</span><span class="asta-switch-desc">Push when an Astabyte build fails.</span></span>
    <span class="asta-switch-track"><input type="checkbox" role="switch" class="asta-switch-input" name="alerts" checked><span class="asta-switch-thumb" aria-hidden="true"></span></span>
  </label>
  <label class="asta-switch asta-switch-sm">
    <span><span class="asta-switch-label">Weekly digest</span></span>
    <span class="asta-switch-track"><input type="checkbox" role="switch" class="asta-switch-input" name="digest"><span class="asta-switch-thumb" aria-hidden="true"></span></span>
  </label>
</div>
