name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE_NAME: asta-ui

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: PRODUCTION
    # Forks have no access to the deploy secrets.
    if: github.repository == 'astabyteidn/asta-ui'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
      - name: Roll out
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}?tag=sha-${GITHUB_SHA}")
          echo "webhook: $code"
          [ "$code" = "200" ] || [ "$code" = "204" ] || exit 1
      - name: Wait for the site
        run: |
          for i in $(seq 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://ui.astabyte.com/healthz || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          exit 1
