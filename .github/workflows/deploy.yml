name: CI & release

# main and PRs: checks only (merging to main does NOT deploy).
# Tags vX.Y.Z: checks, then build :X.Y.Z + :latest and roll out production.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE_NAME: asta-ui

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
      - name: Agent skill is up to date
        run: |
          bun run skill
          git diff --exit-code skills/ || { echo "skills/ is stale: run 'bun run skill' and commit"; exit 1; }

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: PRODUCTION
    # Only release tags deploy. Forks have no access to the deploy secrets.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'astabyteidn/asta-ui'
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$v" = "$pkg" ] || { echo "tag v$v does not match package.json $pkg"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Roll out
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}?tag=${{ steps.version.outputs.version }}")
          echo "webhook: $code"
          [ "$code" = "200" ] || [ "$code" = "204" ] || exit 1
      - name: Wait for the site
        run: |
          for i in $(seq 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://ui.astabyte.com/healthz || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          exit 1
