name: CI & release

# main and PRs: checks only (merging to main does NOT deploy).
# Tags vX.Y.Z: checks, then build :X.Y.Z + :latest and roll out production.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE_NAME: asta-ui

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
      - name: Agent skill is up to date
        run: |
          bun run skill
          git diff --exit-code skills/ || { echo "skills/ is stale: run 'bun run skill' and commit"; exit 1; }
      - name: Base UI tree is up to date
        run: bun run base --check
      - name: Performance rules
        run: bun run perf
      - name: npm package (packages/asta-ui) builds and matches the kit version
        run: |
          node --check packages/asta-ui/bin/asta-ui.mjs
          node packages/asta-ui/bin/asta-ui.mjs --help > /dev/null
          [ "$(node -p "require('./package.json').version")" = "$(node -p "require('./packages/asta-ui/package.json').version")" ] \
            || { echo "packages/asta-ui/package.json version must match package.json"; exit 1; }
          bun packages/asta-ui/build.ts
          cd packages/asta-ui && npm pack --dry-run
      # Go + htmx package (go/): generated templ files, asta.css, asta.js and the version must be committed and current.
      # The CSS-only layer (packages/asta-ui/css) is built from the same runtime, so it is checked here too.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Go package is up to date, vets, tests and builds
        working-directory: go
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1118 generate
          [ -z "$(git status --porcelain .)" ] || { git status --porcelain .; echo "go/ templ output is stale: run 'templ generate' in go/ and commit"; exit 1; }
          (cd .. && bun run go --check)
          (cd .. && bun run css --check)
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/asta-example" ./examples/app
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/asta-gallery" ./examples/gallery
          node --check ui/assets/asta.js

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: PRODUCTION
    # Only release tags deploy. Forks have no access to the deploy secrets.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'astabyteidn/asta-ui'
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$v" = "$pkg" ] || { echo "tag v$v does not match package.json $pkg"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Roll out
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}?tag=${{ steps.version.outputs.version }}")
          echo "webhook: $code"
          [ "$code" = "200" ] || [ "$code" = "204" ] || exit 1
      - name: Wait for the site
        run: |
          for i in $(seq 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://ui.astabyte.com/healthz || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          exit 1
      # The VPS in front keeps a copy of /cdn/* for when the homelab is down. It refreshes in the background
      # within a minute; poll until it serves this release's asta.js, so the kept copy is the new one.
      - name: Refresh the CDN cache
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="version: \"${GITHUB_REF_NAME#v}\""
          for i in $(seq 36); do
            curl -fsS -o /dev/null https://ui.astabyte.com/cdn/asta.css || true
            if curl -fsS https://ui.astabyte.com/cdn/asta.js | grep -qF "$want"; then
              echo "CDN serves $want"; exit 0
            fi
            echo "attempt $i: not yet"
            sleep 10
          done
          echo "::warning::/cdn/asta.js still serves an older version after 6 minutes"

  # After the site is live (the CLI points at its registry), build and publish `asta-ui` (CLI + library) to npm.
  publish-cli:
    needs: deploy
    runs-on: ubuntu-latest
    environment: PRODUCTION
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'astabyteidn/asta-ui'
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing + provenance
    defaults:
      run:
        working-directory: packages/asta-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install and build the library
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun packages/asta-ui/build.ts
      # Trusted Publishing (OIDC): no npm token. Needs npm >= 11.5, which ships with Node 24.
      # The publisher on npm is GitHub Actions, so no personal account or email shows up.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "asta-ui@$v" version > /dev/null 2>&1; then echo "asta-ui@$v already on npm"; exit 0; fi
          npm publish --provenance --access public

  # A GitHub Release for every tag, with the notes from CHANGELOG.md, so each version shows on the repo page.
  release:
    needs: publish-cli
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'astabyteidn/asta-ui'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "$TAG" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --latest
          fi
      # The Go module lives in go/, so Go needs a go/vX.Y.Z tag on the same commit to resolve
      # `go get github.com/astabyteidn/asta-ui/go@vX.Y.Z`.
      - name: Tag the Go module
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/go/$TAG" > /dev/null; then echo "go/$TAG exists"; exit 0; fi
          git tag "go/$TAG" "$GITHUB_SHA"
          git push origin "go/$TAG"
