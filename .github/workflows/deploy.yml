name: CI & release

# main and PRs: checks only (merging to main does NOT deploy).
# Tags vX.Y.Z: checks, then build :X.Y.Z + :latest and roll out production.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE_NAME: asta-ui

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
      - name: Agent skill is up to date
        run: |
          bun run skill
          git diff --exit-code skills/ || { echo "skills/ is stale: run 'bun run skill' and commit"; exit 1; }
      - name: Base UI tree is up to date
        run: bun run base --check
      - name: Performance rules
        run: bun run perf
      - name: npm package (packages/asta-ui) builds and matches the kit version
        run: |
          node --check packages/asta-ui/bin/asta-ui.mjs
          node packages/asta-ui/bin/asta-ui.mjs --help > /dev/null
          [ "$(node -p "require('./package.json').version")" = "$(node -p "require('./packages/asta-ui/package.json').version")" ] \
            || { echo "packages/asta-ui/package.json version must match package.json"; exit 1; }
          bun packages/asta-ui/build.ts
          cd packages/asta-ui && npm pack --dry-run

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: PRODUCTION
    # Only release tags deploy. Forks have no access to the deploy secrets.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'astabyteidn/asta-ui'
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$v" = "$pkg" ] || { echo "tag v$v does not match package.json $pkg"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Roll out
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}?tag=${{ steps.version.outputs.version }}")
          echo "webhook: $code"
          [ "$code" = "200" ] || [ "$code" = "204" ] || exit 1
      - name: Wait for the site
        run: |
          for i in $(seq 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://ui.astabyte.com/healthz || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          exit 1

  # After the site is live (the CLI points at its registry), build and publish `asta-ui` (CLI + library) to npm.
  publish-cli:
    needs: deploy
    runs-on: ubuntu-latest
    environment: PRODUCTION
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'astabyteidn/asta-ui'
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing + provenance
    defaults:
      run:
        working-directory: packages/asta-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install and build the library
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun packages/asta-ui/build.ts
      # Trusted Publishing (OIDC): no npm token. Needs npm >= 11.5, which ships with Node 24.
      # The publisher on npm is GitHub Actions, so no personal account or email shows up.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "asta-ui@$v" version > /dev/null 2>&1; then echo "asta-ui@$v already on npm"; exit 0; fi
          npm publish --provenance --access public
